[package]
name = "OpenRhiza"
version = "0.1.0"
edition = "2021"

[dependencies]
bootloader = { version = "0.9.34", features = ["map_physical_memory"] }
x86_64 = "0.14.2"  # 하드웨어 예외 처리(IDT) 및 I/O 포트 제어를 위한 크레이트
lazy_static = { version = "1.4.0", features = ["spin_no_std"] } # 정적 변수 초기화를 위한 크레이트
pic8259 = "0.10.1" # 하드웨어 인터럽트(키보드 등) 컨트롤러 리매핑
spin = "0.9.8"     # 전역 변수를 안전하게 잠그기 위한 락(Mutex) 크레이트
uart_16550 = "0.2.0" # 시리얼 포트(COM1) 통신을 위한 크레이트
linked_list_allocator = "0.10.5" # 단순 힙 메모리 할당자
wasmi = { version = "0.31.0", default-features = false } # 베어메탈용 WebAssembly 샌드박스 런타임
smoltcp = { version = "0.11", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-icmp", "socket-tcp"] }

# OS 개발을 위한 베어메탈(no_std) 환경 설정입니다.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# bootimage 도구가 QEMU를 실행할 때 사용할 명령어와 경로를 지정합니다.
[package.metadata.bootimage]
run-command = ["C:\\Program Files\\qemu\\qemu-system-x86_64.exe", "-drive", "format=raw,file={}", "-drive", "file=fat:rw:rhiza_drivers,format=raw,index=2", "-serial", "tcp:127.0.0.1:4444,server", "-netdev", "user,id=n1", "-device", "e1000,netdev=n1"]