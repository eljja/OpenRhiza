name: Deploy OpenRhiza Nexus

on:
  push:
    branches:
      - main
    paths:
      - "openrhiza-nexus/**"
      - ".github/workflows/deploy-openrhiza-nexus.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OPENRHIZA_HOST }}
          username: ${{ secrets.OPENRHIZA_USER }}
          key: ${{ secrets.OPENRHIZA_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd "${{ secrets.OPENRHIZA_REPO_PATH }}"
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            cd openrhiza-nexus
            npm ci
            npm run build

            sudo systemctl restart "${{ secrets.OPENRHIZA_SERVICE_NAME }}"
            sudo systemctl is-active --quiet "${{ secrets.OPENRHIZA_SERVICE_NAME }}"

            curl -sf http://127.0.0.1:3000/api/health > /dev/null
            curl -sf -X POST http://127.0.0.1:3000/api/v1/skill/download \
              -H "Content-Type: application/json" \
              -d '{"protocol_version":"v1","node_id":"deploy-check","skill_id":"skill_registry_lookup_v1"}' \
              > /dev/null
